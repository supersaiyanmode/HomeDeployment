---
- name: Ensure Tailscale auth key is provided
  ansible.builtin.assert:
    that: TAILSCALE_AUTH_KEY != ""
    fail_msg: "TAILSCALE_AUTH_KEY is not set in the inventory (check environment)."

- name: "Generate Tailscale compose config"
  include_role:
    name: utils
    tasks_from: install_docker_compose_raw.yml
  vars:
    container_name: tailscale
    host: "eagle"
    docker_compose_content: |
      networks:
        proxy:
          external: true
      services:
        tailscale:
          image: "{{ tailscale_image }}"
          container_name: tailscale
          restart: unless-stopped
          network_mode: bridge
          devices:
            - /dev/net/tun:/dev/net/tun
          cap_add:
            - NET_ADMIN
          volumes:
            - /docker/tailscale/tailscale-config:/tailscale-config
          environment:
            TS_STATE_DIR: /tailscale-config
            TS_ACCEPT_DNS: 'true'
            TS_AUTHKEY: "{{ TAILSCALE_AUTH_KEY }}"
            TS_HOSTNAME: "{{ TAILSCALE_MAIN_HOST_NAME }}"
            TS_ROUTES: "{{ TAILSCALE_SUBNET }}"
            TS_EXTRA_ARGS: "--advertise-exit-node"
