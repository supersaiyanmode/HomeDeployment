---
- name: Ensure Hawser join token is provided
  ansible.builtin.assert:
    that: hawser_join_token != ""
    fail_msg: "hawser_join_token is not set in the inventory (check HAWSER_JOIN_TOKEN_{{ inventory_hostname }} env var)."

- name: Install and run Hawser Agent container
  include_role:
    name: utils
    tasks_from: install_docker_image.yml
  vars:
    container_name: hawser-agent
    container_image: "ghcr.io/finsys/hawser:latest"
    image_pull: true
    restart_policy: "unless-stopped"
    custom_mounts:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/hosts:/etc/hosts:ro
    env:
      DOCKHAND_SERVER_URL: "wss://{{ DOCKHAND_DOMAIN }}/api/hawser/connect"
      TOKEN: "{{ hawser_join_token }}"
      AGENT_NAME: "{{ inventory_hostname }}"
      AGENT_ID: "{{ hawser_agent_id }}"
      TLS_SKIP_VERIFY: "true"
